services:
  jellyfin:
    image: jellyfin/jellyfin:12.1
    container_name: jellyfin
    ports:
      - "${JELLYFIN_PORT}:${JELLYFIN_PORT}"
      - "${JELLYFIN_HTTPS_PORT}:${JELLYFIN_HTTPS_PORT}"
    volumes:
      - ./config/jellyfin:/config
      - ./media:/media
      - /tmp:/transcode
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    restart: unless-stopped
    networks:
      - jellyfin-network

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    container_name: sonarr
    ports:
      - "${SONARR_PORT}:${SONARR_PORT}"
    volumes:
      - ./config/sonarr:/config
      - ./media/tv:/tv
      - ./downloads:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    restart: unless-stopped
    networks:
      - jellyfin-network
    depends_on:
      - prowlarr
      - qbittorrent

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5
    container_name: prowlarr
    ports:
      - "${PROWLARR_PORT}:${PROWLARR_PORT}"
    volumes:
      - ./config/prowlarr:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    restart: unless-stopped
    networks:
      - jellyfin-network

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3
    container_name: qbittorrent
    ports:
      - "${QBITTORRENT_PORT}:${QBITTORRENT_PORT}"
      - "${QBITTORRENT_PORT_RANGE}:${QBITTORRENT_PORT_RANGE}"
      - "${QBITTORRENT_PORT_RANGE}:${QBITTORRENT_PORT_RANGE}/udp"
    volumes:
      - ./config/qbittorrent:/config
      - ./downloads:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - WEBUI_PORT=8080
    restart: unless-stopped
    networks:
      - jellyfin-network

  jackett:
    image: lscr.io/linuxserver/jackett:0.24.2237
    container_name: jackett
    ports:
      - "${JACKETT_PORT}:${JACKETT_PORT}"
    volumes:
      - ./config/jackett:/config
      - ./downloads:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    restart: unless-stopped
    networks:
      - jellyfin-network

  # flaresolverr substituído pelo trawl (com fidelidade ao /v1)
  torrent-indexer:
    build: ./torrent-indexer
    container_name: torrent-indexer
    ports:
      - "${TORRENT_INDEXER_PORT:-7006}:7006"
    environment:
      - PORT=7006
      - LOG_LEVEL=0
      - SPOOFED_USER_AGENT=curl/8.7.1
      - REDIS_HOST=redis
      - INDEXER_REDE_TORRENT_URL=https://redestorrents.com/
      - FLARESOLVERR_ADDRESS=http://trawl:8191
      - TZ=America/Sao_Paulo
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - jellyfin-network

  redis:
    image: redis:7-alpine
    container_name: torrent-indexer-redis
    restart: unless-stopped
    networks:
      - jellyfin-network

  trawl:
    image: ghcr.io/germondai/trawl:latest
    container_name: trawl
    ports:
      - "8191:8191"
    environment:
      - SESSION_CACHE_DRIVER=redis
      - REDIS_URL=redis://torrent-indexer-redis:6379
    shm_size: 1gb
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - jellyfin-network

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4
    container_name: radarr
    ports:
      - "${RADARR_PORT}:${RADARR_PORT}"
    volumes:
      - ./config/radarr:/config
      - ./media/movies:/movies
      - ./downloads:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    restart: unless-stopped
    networks:
      - jellyfin-network
    depends_on:
      - prowlarr
      - qbittorrent

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.1
    container_name: bazarr
    ports:
      - "${BAZARR_PORT}:${BAZARR_PORT}"
    volumes:
      - ./config/bazarr:/config
      - ./media/movies:/movies
      - ./media/tv:/tv
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    restart: unless-stopped
    networks:
      - jellyfin-network

networks:
  jellyfin-network:
    driver: bridge
